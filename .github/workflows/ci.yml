name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings

  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  check:
    name: check (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  no-default-features:
    name: no-default-features (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p hymt-cli --no-default-features

  shell-syntax:
    name: shell syntax
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' scripts < <(find scripts services -type f -name '*.sh' -print0)
          ((${#scripts[@]} > 0))
          bash -n "${scripts[@]}"

  service-verify:
    name: service verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify systemd service units
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          set +e
          systemd-analyze verify services/*.service >"$output" 2>&1
          status=$?
          set -e
          cat "$output"
          if ((status == 0)); then
            exit 0
          fi
          expected="$(grep -E '^[^:]+: Command /[^ ]+ is not executable: No such file or directory$' "$output" || true)"
          unexpected="$(grep -Ev '^[^:]+: Command /[^ ]+ is not executable: No such file or directory$' "$output" || true)"
          if [[ -z "$expected" || -n "$unexpected" ]]; then
            printf '%s\n' "Unexpected systemd-analyze verify output:" >&2
            printf '%s\n' "$unexpected" >&2
            exit "$status"
          fi
          printf '%s\n' "Only host-specific ExecStart paths were unavailable; service syntax is valid."

  toml-parse:
    name: TOML parse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Parse tracked TOML files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import tomllib

          paths = [
              Path(path.decode())
              for path in subprocess.check_output(
                  ["git", "ls-files", "-z", "--", "*.toml"]
              ).split(b"\0")
              if path
          ]
          if not paths:
              raise SystemExit("No tracked TOML files found")
          for path in paths:
              with path.open("rb") as source:
                  tomllib.load(source)
              print(f"Parsed {path}")
          PY
