schema_version = "hymt-benchmark-systems/v1"
prompt_schema_version = "hy-mt2-prompts/v2"

[[systems]]
id = "transformers"
backend = "transformers"
quantization = "full-precision"
endpoint_env = "HYMT_BENCH_TRANSFORMERS_URL"
model_env = "HYMT_BENCH_TRANSFORMERS_MODEL"
model_revision_env = "HYMT_BENCH_TRANSFORMERS_MODEL_REVISION"
tokenizer_revision_env = "HYMT_BENCH_TRANSFORMERS_TOKENIZER_REVISION"
backend_version_env = "HYMT_BENCH_TRANSFORMERS_VERSION"
supports_min_p = true
supports_repeat_last_n = false
props_path = "/props"

[[systems.sampler_variants]]
id = "service-defaults"
client_overrides = false

[[systems.sampler_variants]]
id = "min-p-enabled-top-p-0.8"
client_overrides = true
top_p = 0.8
min_p = 0.10
repeat_last_n = 64

[[systems.sampler_variants]]
id = "min-p-disabled-top-p-0.8"
client_overrides = true
top_p = 0.8
min_p = 0.0
repeat_last_n = 64

[[systems.sampler_variants]]
id = "repeat-last-n-64"
client_overrides = true
top_p = 0.95
repeat_last_n = 64

[[systems.sampler_variants]]
id = "repeat-last-n-full"
client_overrides = true
top_p = 0.95
repeat_last_n = -1

