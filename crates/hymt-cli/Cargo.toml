[package]
name = "hymt-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "hymt"
path = "src/main.rs"

[features]
default = ["telegram"]
# Optional Telegram bot long-poll subcommand (`hymt telegram`).
# Disable with: cargo install --path crates/hymt-cli --no-default-features
telegram = ["dep:reqwest", "dep:serde", "dep:serde_json"]

[dependencies]
hymt-core = { path = "../hymt-core" }
hymt-segment = { path = "../hymt-segment" }
hymt-client = { path = "../hymt-client" }
hymt-cache = { path = "../hymt-cache" }
hymt-translate = { path = "../hymt-translate" }
anyhow = { workspace = true }
tokio = { workspace = true }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"], optional = true }
serde = { workspace = true, optional = true }
serde_json = { version = "1", optional = true }
