[package]
name = "hymt-translate"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
watch = ["dep:notify"]

[dependencies]
hymt-core = { path = "../hymt-core" }
hymt-segment = { path = "../hymt-segment" }
hymt-client = { path = "../hymt-client" }
hymt-cache = { path = "../hymt-cache" }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"
walkdir = "2"
notify = { version = "6", optional = true }

[dev-dependencies]
tempfile = "3"
