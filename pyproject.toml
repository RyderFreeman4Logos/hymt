[project]
name = "hymt"
version = "0.1.0"
description = "CLI for Hy-MT2 translation with auto-segmentation, concurrency, and hot-reloadable config"
requires-python = ">=3.11"
license = "Apache-2.0"
readme = "README.md"
dependencies = [
    "click>=8.0",
    "httpx>=0.27",
    "tokenizers>=0.21; sys_platform != 'android'",
    "huggingface-hub>=0.28,<1.14; sys_platform != 'android'",
]

[project.optional-dependencies]
detect = [
    "langdetect>=1.0.9",
]
watch = [
    "watchfiles>=1.0",
]

[project.scripts]
hymt = "hymt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
