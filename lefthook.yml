# Lefthook — git hooks manager
# Install: lefthook install
# Docs: https://github.com/evilmartians/lefthook

no_tty: true

pre-commit:
  commands:
    quality-gates:
      run: just pre-commit

pre-push:
  commands:
    review-check:
      run: scripts/hooks/review-check.sh

post-commit:
  commands:
    auto-translate-readme:
      run: bash scripts/hooks/auto-translate-readme.sh

post-push:
  commands:
    reinstall:
      run: scripts/hooks/post-push-reinstall.sh
